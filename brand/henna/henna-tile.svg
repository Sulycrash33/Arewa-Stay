<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <g id="paisley">
      <!-- Classic henna paisley (mango/kairi) motif: curled teardrop with inner detail -->
      <path d="M0 40 C -18 40 -30 26 -30 8 C -30 -12 -14 -24 4 -22 C 20 -20 30 -6 24 10 C 20 22 8 26 0 40 Z"
            fill="none" stroke="currentColor" stroke-width="1.4"/>
      <path d="M-4 30 C -14 28 -20 18 -18 6 C -16 -6 -6 -14 6 -12"
            fill="none" stroke="currentColor" stroke-width="1"/>
      <circle cx="2" cy="-14" r="2" fill="currentColor"/>
      <circle cx="10" cy="-6" r="1.3" fill="currentColor"/>
      <circle cx="-6" cy="20" r="1.3" fill="currentColor"/>
    </g>
    <g id="flower">
      <!-- Small 6-petal mehndi floral accent -->
      <g stroke="currentColor" stroke-width="1" fill="none">
        <ellipse cx="0" cy="-6" rx="3" ry="6"/>
        <ellipse cx="5.2" cy="-3" rx="3" ry="6" transform="rotate(60 5.2 -3)"/>
        <ellipse cx="5.2" cy="3" rx="3" ry="6" transform="rotate(120 5.2 3)"/>
        <ellipse cx="0" cy="6" rx="3" ry="6" transform="rotate(180 0 6)"/>
        <ellipse cx="-5.2" cy="3" rx="3" ry="6" transform="rotate(240 -5.2 3)"/>
        <ellipse cx="-5.2" cy="-3" rx="3" ry="6" transform="rotate(300 -5.2 -3)"/>
      </g>
      <circle r="1.6" fill="currentColor"/>
    </g>
    <path id="dotted-vine" d="M0 0 C 20 -10 40 10 60 0" fill="none" stroke="currentColor" stroke-width="0.8" stroke-dasharray="1 5" stroke-linecap="round"/>
  </defs>

  <g color="#8a6a45" opacity="0.55">
    <use href="#paisley" x="60" y="70" transform="rotate(-15 60 70)"/>
    <use href="#flower" x="170" y="40"/>
    <use href="#flower" x="35" y="190"/>
    <use href="#flower" x="195" y="180"/>
    <use href="#dotted-vine" x="90" y="30"/>
    <use href="#dotted-vine" x="10" y="130" transform="rotate(40 10 130)"/>
    <use href="#dotted-vine" x="140" y="120" transform="rotate(-30 140 120)"/>
  </g>
</svg>
