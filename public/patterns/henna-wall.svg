<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!--
    Dense all-over mehndi/henna wall texture, meant to tile continuously as
    a site-wide background (unlike henna.svg / henna-light.svg, which are
    sparse accents for single sections). More motifs per tile, smaller tile
    size, so it reads as a continuous surface pattern rather than a few
    isolated icons — per reference: coverage across the whole hand/arm,
    not scattered spot motifs.
  -->
  <defs>
    <g id="w-paisley">
      <path d="M0 26 C -12 26 -20 17 -20 5 C -20 -8 -9 -16 3 -14 C 13 -13 20 -4 16 6 C 13 14 5 17 0 26 Z"
            fill="none" stroke="currentColor" stroke-width="1.1"/>
      <path d="M-3 19 C -9 18 -13 12 -12 4 C -11 -4 -4 -9 4 -8"
            fill="none" stroke="currentColor" stroke-width="0.8"/>
      <circle cx="1" cy="-9" r="1.3" fill="currentColor"/>
      <circle cx="7" cy="-4" r="0.9" fill="currentColor"/>
      <circle cx="-4" cy="13" r="0.9" fill="currentColor"/>
    </g>
    <g id="w-flower">
      <g stroke="currentColor" stroke-width="0.8" fill="none">
        <ellipse cx="0" cy="-4.5" rx="2.2" ry="4.5"/>
        <ellipse cx="3.9" cy="-2.25" rx="2.2" ry="4.5" transform="rotate(60 3.9 -2.25)"/>
        <ellipse cx="3.9" cy="2.25" rx="2.2" ry="4.5" transform="rotate(120 3.9 2.25)"/>
        <ellipse cx="0" cy="4.5" rx="2.2" ry="4.5" transform="rotate(180 0 4.5)"/>
        <ellipse cx="-3.9" cy="2.25" rx="2.2" ry="4.5" transform="rotate(240 -3.9 2.25)"/>
        <ellipse cx="-3.9" cy="-2.25" rx="2.2" ry="4.5" transform="rotate(300 -3.9 -2.25)"/>
      </g>
      <circle r="1.1" fill="currentColor"/>
    </g>
    <g id="w-bud">
      <path d="M0 0 C -3 -5 -1 -10 0 -12 C 1 -10 3 -5 0 0 Z" fill="currentColor" opacity="0.9"/>
    </g>
    <path id="w-vine" d="M0 0 C 12 -7 24 7 36 0" fill="none" stroke="currentColor" stroke-width="0.6" stroke-dasharray="0.8 4" stroke-linecap="round"/>
  </defs>

  <g color="#8a6a45" opacity="0.55">
    <!-- corner + mid paisleys, alternating orientation like real mehndi rows -->
    <use href="#w-paisley" x="30" y="30" transform="rotate(-18 30 30)"/>
    <use href="#w-paisley" x="150" y="20" transform="rotate(20 150 20) scale(0.8)"/>
    <use href="#w-paisley" x="95" y="100" transform="rotate(-10 95 100) scale(0.9)"/>
    <use href="#w-paisley" x="20" y="160" transform="rotate(160 20 160) scale(0.85)"/>
    <use href="#w-paisley" x="165" y="150" transform="rotate(200 165 150) scale(0.75)"/>

    <!-- floral fill between paisleys -->
    <use href="#w-flower" x="70" y="20"/>
    <use href="#w-flower" x="140" y="65"/>
    <use href="#w-flower" x="35" y="95"/>
    <use href="#w-flower" x="180" y="95"/>
    <use href="#w-flower" x="60" y="150"/>
    <use href="#w-flower" x="120" y="175"/>
    <use href="#w-flower" x="10" y="10"/>

    <!-- small bud accents, dense like fingertip detailing in reference -->
    <use href="#w-bud" x="55" y="65"/>
    <use href="#w-bud" x="115" y="35"/>
    <use href="#w-bud" x="160" y="105"/>
    <use href="#w-bud" x="10" y="130"/>
    <use href="#w-bud" x="105" y="140"/>
    <use href="#w-bud" x="185" y="35"/>
    <use href="#w-bud" x="75" y="185"/>

    <!-- connecting dotted vine lines, the "lattice" feel that ties clusters together -->
    <use href="#w-vine" x="45" y="45" transform="rotate(15 45 45)"/>
    <use href="#w-vine" x="110" y="15" transform="rotate(-25 110 15)"/>
    <use href="#w-vine" x="10" y="105" transform="rotate(50 10 105)"/>
    <use href="#w-vine" x="130" y="130" transform="rotate(-40 130 130)"/>
    <use href="#w-vine" x="55" y="175" transform="rotate(10 55 175)"/>
  </g>
</svg>
