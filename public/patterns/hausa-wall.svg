<svg width="260" height="260" viewBox="0 0 260 260" xmlns="http://www.w3.org/2000/svg">
  <!--
    Hausa-motif wall pattern — distinct from generic South-Asian mehndi
    paisley (which the earlier henna-wall.svg mistakenly leaned on).
    Motifs here: mudbrick minaret/tower (Kano-style stepped facade),
    calabash pot with banded pattern, geometric knotwork square, diamond
    lattice medallion, star rosette, crescent moon, small flower/dot
    accents, thin dotted vine linking clusters — matching the reference
    design (dark linework on light ground, architectural + geometric
    rather than floral/paisley).

    Opacity is baked in here (not applied via a wrapper element), because
    this file is used directly as the <body> background-image — body
    carries real scrollable content, so nothing external can safely dim
    it after the fact.
  -->
  <defs>
    <!-- Stepped mudbrick tower / minaret silhouette -->
    <g id="h-tower">
      <path d="M-10 30 L-10 8 L-7 8 L-7 2 L-4 2 L-4 -2 L4 -2 L4 2 L7 2 L7 8 L10 8 L10 30 Z"
            fill="none" stroke="currentColor" stroke-width="1.1"/>
      <path d="M0 -2 L0 -9" stroke="currentColor" stroke-width="1.1"/>
      <rect x="-2.4" y="14" width="4.8" height="7" fill="none" stroke="currentColor" stroke-width="0.8"/>
      <line x1="-10" y1="22" x2="10" y2="22" stroke="currentColor" stroke-width="0.6"/>
    </g>

    <!-- Calabash / clay pot with banded pattern -->
    <g id="h-pot">
      <path d="M0 -10 C 5 -10 6 -6 6 -3 C 9 0 9 8 0 10 C -9 8 -9 0 -6 -3 C -6 -6 -5 -10 0 -10 Z"
            fill="none" stroke="currentColor" stroke-width="1"/>
      <path d="M-6.5 -1 L6.5 -1 M-8 3.5 L8 3.5" stroke="currentColor" stroke-width="0.6"/>
      <path d="M-3.5 1.2 L3.5 1.2 M-3.5 1.2 L0 3 L3.5 1.2" stroke="currentColor" stroke-width="0.5" fill="none"/>
    </g>

    <!-- Geometric knotwork square (interlace, Hausa/Nupe woodwork motif) -->
    <g id="h-knot">
      <rect x="-7" y="-7" width="14" height="14" fill="none" stroke="currentColor" stroke-width="0.9"/>
      <path d="M-7 0 L0 -7 L7 0 L0 7 Z" fill="none" stroke="currentColor" stroke-width="0.9"/>
      <circle r="1.5" fill="none" stroke="currentColor" stroke-width="0.7"/>
    </g>

    <!-- 8-point star rosette -->
    <g id="h-star">
      <g fill="none" stroke="currentColor" stroke-width="0.8">
        <path d="M0 -7 L1.6 -1.6 L7 0 L1.6 1.6 L0 7 L-1.6 1.6 L-7 0 L-1.6 -1.6 Z"/>
        <path d="M0 -5 L1.1 -1.1 L5 0 L1.1 1.1 L0 5 L-1.1 1.1 L-5 0 L-1.1 -1.1 Z" transform="rotate(22.5)"/>
      </g>
    </g>

    <!-- Diamond lattice medallion -->
    <g id="h-diamond">
      <path d="M0 -11 L11 0 L0 11 L-11 0 Z" fill="none" stroke="currentColor" stroke-width="1"/>
      <path d="M0 -6 L6 0 L0 6 L-6 0 Z" fill="none" stroke="currentColor" stroke-width="0.7"/>
      <circle r="1.3" fill="currentColor"/>
    </g>

    <!-- Crescent moon -->
    <g id="h-moon">
      <path d="M4 -6 A 6 6 0 1 0 4 6 A 4.6 4.6 0 1 1 4 -6 Z" fill="currentColor" opacity="0.85"/>
    </g>

    <!-- Small flower accent -->
    <g id="h-flower">
      <g stroke="currentColor" stroke-width="0.7" fill="none">
        <ellipse cx="0" cy="-3.2" rx="1.6" ry="3.2"/>
        <ellipse cx="2.8" cy="-1.6" rx="1.6" ry="3.2" transform="rotate(60 2.8 -1.6)"/>
        <ellipse cx="2.8" cy="1.6" rx="1.6" ry="3.2" transform="rotate(120 2.8 1.6)"/>
        <ellipse cx="0" cy="3.2" rx="1.6" ry="3.2" transform="rotate(180 0 3.2)"/>
        <ellipse cx="-2.8" cy="1.6" rx="1.6" ry="3.2" transform="rotate(240 -2.8 1.6)"/>
        <ellipse cx="-2.8" cy="-1.6" rx="1.6" ry="3.2" transform="rotate(300 -2.8 -1.6)"/>
      </g>
      <circle r="0.9" fill="currentColor"/>
    </g>

    <path id="h-vine" d="M0 0 C 14 -8 28 8 42 0" fill="none" stroke="currentColor" stroke-width="0.5" stroke-dasharray="0.8 4.5" stroke-linecap="round"/>
  </defs>

  <!-- Opacity baked in at the group level: this tile is used directly as
       the document body's background, so the final on-page alpha here IS
       the finished value — keep it low enough to sit behind all text and
       cards without ever competing with them. -->
  <g color="#8a6a45" opacity="0.34">
    <use href="#h-tower" x="35" y="40"/>
    <use href="#h-tower" x="200" y="205" transform="rotate(4 200 205) scale(0.85)"/>
    <use href="#h-tower" x="55" y="230" transform="scale(0.8)"/>

    <use href="#h-pot" x="150" y="35"/>
    <use href="#h-pot" x="20" y="150" transform="scale(0.9)"/>
    <use href="#h-pot" x="235" y="110"/>

    <use href="#h-knot" x="95" y="95"/>
    <use href="#h-knot" x="215" y="55" transform="rotate(10 215 55)"/>
    <use href="#h-knot" x="130" y="180" transform="scale(0.85)"/>

    <use href="#h-star" x="180" y="150"/>
    <use href="#h-star" x="65" y="100" transform="scale(0.85)"/>
    <use href="#h-star" x="10" y="15" transform="scale(0.75)"/>

    <use href="#h-diamond" x="120" y="45"/>
    <use href="#h-diamond" x="30" y="190" transform="rotate(20 30 190) scale(0.9)"/>
    <use href="#h-diamond" x="245" y="230" transform="scale(0.8)"/>

    <use href="#h-moon" x="200" y="20"/>
    <use href="#h-moon" x="10" y="100" transform="scale(0.8)"/>
    <use href="#h-moon" x="160" y="230" transform="scale(0.7)"/>

    <use href="#h-flower" x="70" y="55"/>
    <use href="#h-flower" x="155" y="105"/>
    <use href="#h-flower" x="235" y="165"/>
    <use href="#h-flower" x="100" y="220"/>
    <use href="#h-flower" x="185" y="70"/>

    <use href="#h-vine" x="10" y="60" transform="rotate(12 10 60)"/>
    <use href="#h-vine" x="130" y="20" transform="rotate(-18 130 20)"/>
    <use href="#h-vine" x="70" y="150" transform="rotate(30 70 150)"/>
    <use href="#h-vine" x="180" y="195" transform="rotate(-8 180 195)"/>
  </g>
</svg>
